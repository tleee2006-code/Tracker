name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Reorganize Files and Build APK
      run: |
        echo "=== BẮT ĐẦU SẮP XẾP VÀ CẤU HÌNH DỰ ÁN V3 ==="
        
        if [ ! -d "app/src/main" ]; then
          mkdir -p app/src/main/java/com/shipper/tracker/data
          mkdir -p app/src/main/java/com/shipper/tracker/service
          mkdir -p app/src/main/java/com/shipper/tracker/ui
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # Chuyển code Kotlin
          [ -f "DatabaseHelper.kt" ] && mv DatabaseHelper.kt app/src/main/java/com/shipper/tracker/data/
          [ -f "GpsTrackingService.kt" ] && mv GpsTrackingService.kt app/src/main/java/com/shipper/tracker/service/
          [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/shipper/tracker/ui/

          # Chuyển Manifest
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/

          # Chuyển Layouts & Drawables mới
          [ -f "bg_card.xml" ] && mv bg_card.xml app/src/main/res/drawable/
          [ -f "bg_input.xml" ] && mv bg_input.xml app/src/main/res/drawable/
          [ -f "activity_main.xml" ] && mv activity_main.xml app/src/main/res/layout/
          [ -f "item_daily_summary.xml" ] && mv item_daily_summary.xml app/src/main/res/layout/
          [ -f "item_shift_detail.xml" ] && mv item_shift_detail.xml app/src/main/res/layout/
          [ -f "dialog_end_shift.xml" ] && mv dialog_end_shift.xml app/src/main/res/layout/
          [ -f "item_fuel.xml" ] && mv item_fuel.xml app/src/main/res/layout/

          # Chuyển Values
          [ -f "colors.xml" ] && mv colors.xml app/src/main/res/values/
          [ -f "strings.xml" ] && mv strings.xml app/src/main/res/values/
          [ -f "themes.xml" ] && mv themes.xml app/src/main/res/values/

          # Chuyển Gradle build
          if [ -f "build.gradle (1).kts" ]; then
            if grep -q "compileSdk" "build.gradle (1).kts"; then
              mv "build.gradle (1).kts" app/build.gradle.kts
            else
              mv "build.gradle.kts" app/build.gradle.kts
              mv "build.gradle (1).kts" build.gradle.kts
            fi
          fi
        fi

        # Cấu hình AndroidX và Android 15
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties

        # Sửa lỗi ký tự & trong XML
        find . -name "*.xml" -exec sed -i 's/ & / và /g' {} +

        # Tạo gradlew
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

        # Build APK
        ./gradlew assembleDebug --stacktrace

        mkdir -p $GITHUB_WORKSPACE/apk_output
        find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/apk_output/ \;

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ShipperTracker-App
        path: apk_output/*.apk
